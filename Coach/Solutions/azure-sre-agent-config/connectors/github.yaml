# GitHub OAuth connector (no PAT). Imported from dm-chelupati/sre-agent-lab.
# NOTE: the SRE Agent data-plane API expects the connector resource `type` to be
# "AgentConnector"; in this repo the generic connector body builder
# (data_put_manifest) derives `type` from `.kind`, so kind is intentionally
# AgentConnector here to reproduce the proven lab payload:
#   {name:"github", type:"AgentConnector",
#    properties:{dataConnectorType:"GitHubOAuth", dataSource:"github-oauth"}}
# A one-time interactive OAuth authorization in the SRE Agent portal is required
# before GitHub tools (code search, issue management) become usable.
api_version: azuresre.ai/v1
kind: AgentConnector
metadata:
  name: github
spec:
  properties:
    dataConnectorType: GitHubOAuth
    dataSource: github-oauth
