api_version: azuresre.ai/v1
kind: Skill
metadata:
  name: udr-asymmetry-investigation
spec:
  description: Investigate UDR-induced asymmetric routing and blackhole scenarios using routes, next-hop checks, and Traffic Analytics evidence.
  content_file: ./udr-asymmetry-investigation.md
  tools:
    - RunAzCliReadCommands
    - QueryLogAnalyticsByWorkspaceId
    - GetAzCliHelp
  safety:
    default_mode: read_only
    requires_approval_for_actions: true