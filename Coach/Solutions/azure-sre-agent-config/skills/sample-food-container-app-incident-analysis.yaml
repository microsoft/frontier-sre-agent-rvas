api_version: azuresre.ai/v1
kind: Skill
metadata:
  name: sample-food-container-app-incident-analysis
spec:
  description: Diagnose Sample Food Ordering App incidents on Azure Container Apps using Container Apps logs, Application Insights, Azure Monitor, and demo runbooks.
  content_file: ./sample-food-container-app-incident-analysis.md
  tools:
    - RunAzCliReadCommands
    - QueryAppInsightsByResourceId
    - QueryLogAnalyticsByWorkspaceId
    - GetAzCliHelp
  safety:
    default_mode: read_only
    requires_approval_for_actions: true