name: Deploy Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev
      imageTag:
        description: "Image tag to deploy"
        required: false
        type: string
        default: latest
      deployBerlinMcp:
        description: "Deploy Berlin MCP app"
        required: true
        type: boolean
        default: true
      deployVmHealth:
        description: "Deploy VM Health Control app"
        required: true
        type: boolean
        default: true

env:
  AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
  LISBON_RESOURCE_GROUP: ${{ vars.LISBON_RESOURCE_GROUP }}
  BERLIN_RESOURCE_GROUP: ${{ vars.BERLIN_RESOURCE_GROUP }}
  CHAOS_CONTROL_RESOURCE_GROUP: ${{ vars.CHAOS_CONTROL_RESOURCE_GROUP }}
  CHAOS_CONTROL_CONTAINER_APP_NAME: ${{ vars.CHAOS_CONTROL_CONTAINER_APP_NAME }}
  BERLIN_MCP_RESOURCE_GROUP: ${{ vars.BERLIN_MCP_RESOURCE_GROUP }}
  VM_HEALTH_RESOURCE_GROUP: ${{ vars.VM_HEALTH_RESOURCE_GROUP }}
  VM_HEALTH_CONTAINER_APP_NAME: ${{ vars.VM_HEALTH_CONTAINER_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Lisbon, Berlin, Chaos and optional VM Health
        run: |
          set -euo pipefail

          deploy_app() {
            local image_name="$1"
            local app_name="$2"
            local resource_group="$3"
            local image="${AZURE_CONTAINER_REGISTRY}.azurecr.io/${image_name}:${{ inputs.imageTag || 'latest' }}"

            az acr repository show \
              --name "$AZURE_CONTAINER_REGISTRY" \
              --image "${image_name}:${{ inputs.imageTag || 'latest' }}" \
              --output none

            az containerapp update \
              --name "$app_name" \
              --resource-group "$resource_group" \
              --image "$image" \
              --output none
          }

          deploy_app "lisbon-parking-api" "ca-parking-lisbon" "$LISBON_RESOURCE_GROUP"
          deploy_app "berlin-parking-api" "ca-parking-berlin" "$BERLIN_RESOURCE_GROUP"
          deploy_app "chaos-control" "$CHAOS_CONTROL_CONTAINER_APP_NAME" "$CHAOS_CONTROL_RESOURCE_GROUP"

          if [ "${{ inputs.deployVmHealth }}" = "true" ]; then
            VM_HEALTH_RG="${VM_HEALTH_RESOURCE_GROUP:-$CHAOS_CONTROL_RESOURCE_GROUP}"
            VM_HEALTH_APP="${VM_HEALTH_CONTAINER_APP_NAME:-ca-vm-health-control}"
            deploy_app "vm-health-control" "$VM_HEALTH_APP" "$VM_HEALTH_RG"
          fi

      - name: Deploy Berlin MCP
        if: inputs.deployBerlinMcp == true
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${BERLIN_MCP_RESOURCE_GROUP:-}" ]; then
            echo "BERLIN_MCP_RESOURCE_GROUP variable not configured, skipping Berlin MCP deployment."
            exit 0
          fi

          if ! az group show --name "$BERLIN_MCP_RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Berlin MCP resource group not found, skipping."
            exit 0
          fi

          IMAGE="${AZURE_CONTAINER_REGISTRY}.azurecr.io/berlin-mcp-server:${{ inputs.imageTag || 'latest' }}"
          az acr repository show \
            --name "$AZURE_CONTAINER_REGISTRY" \
            --image "berlin-mcp-server:${{ inputs.imageTag || 'latest' }}" \
            --output none

          BERLIN_API_FQDN=$(az containerapp show \
            --name ca-parking-berlin \
            --resource-group "$BERLIN_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          APPINSIGHTS_CONNECTION=$(az monitor app-insights component show \
            --app appi-parking-berlin-mcp \
            --resource-group "$BERLIN_MCP_RESOURCE_GROUP" \
            --query connectionString \
            --output tsv)

          az containerapp update \
            --name ca-berlin-mcp \
            --resource-group "$BERLIN_MCP_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --set-env-vars \
              "BERLIN_API_URL=https://${BERLIN_API_FQDN}" \
              "APPLICATIONINSIGHTS_CONNECTION_STRING=${APPINSIGHTS_CONNECTION}" \
              "MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}"
