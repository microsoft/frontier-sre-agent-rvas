name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev
      location:
        description: "Azure region"
        required: true
        type: string
        default: westeurope
      parametersFile:
        description: "Parameters file path"
        required: true
        type: string
        default: infrastructure/main.parameters.json
      confirmDeployment:
        description: "Type DEPLOY to confirm"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmDeployment }}" != "DEPLOY" ]; then
            echo "Deployment cancelled: confirmation not provided"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract subscription ID
        id: sub
        run: |
          SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')
          echo "subscription-id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Validate parameters file
        run: |
          test -f "${{ inputs.parametersFile }}"
          jq empty "${{ inputs.parametersFile }}"

      - name: Pre-deploy what-if
        run: |
          az deployment sub what-if \
            --name "infra-deploy-preview-$(date +%Y%m%d-%H%M%S)" \
            --location "${{ inputs.location }}" \
            --template-file infrastructure/main.bicep \
            --parameters "${{ inputs.parametersFile }}" \
            --subscription "${{ steps.sub.outputs.subscription-id }}"

      - name: Deploy infrastructure
        run: |
          az deployment sub create \
            --name "infra-deploy-${{ inputs.environment }}-$(date +%Y%m%d-%H%M%S)" \
            --location "${{ inputs.location }}" \
            --template-file infrastructure/main.bicep \
            --parameters "${{ inputs.parametersFile }}" \
            --subscription "${{ steps.sub.outputs.subscription-id }}"
