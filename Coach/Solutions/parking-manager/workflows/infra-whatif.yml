name: Infrastructure What-If

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "workflows/infra-whatif.yml"
  workflow_dispatch:
    inputs:
      location:
        description: "Azure region for what-if"
        required: true
        type: string
        default: westeurope
      parametersFile:
        description: "Parameters file path"
        required: true
        type: string
        default: infrastructure/main.parameters.json

jobs:
  whatif:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract subscription ID
        id: sub
        run: |
          SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')
          echo "subscription-id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Validate parameters file
        run: |
          test -f "${{ inputs.parametersFile || 'infrastructure/main.parameters.json' }}"
          jq empty "${{ inputs.parametersFile || 'infrastructure/main.parameters.json' }}"

      - name: Run what-if
        run: |
          az deployment sub what-if \
            --name "infra-whatif-$(date +%Y%m%d-%H%M%S)" \
            --location "${{ inputs.location || 'westeurope' }}" \
            --template-file infrastructure/main.bicep \
            --parameters "${{ inputs.parametersFile || 'infrastructure/main.parameters.json' }}" \
            --subscription "${{ steps.sub.outputs.subscription-id }}"
