name: Docker Build and Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lisbon-parking-api
            context: Student/Resources/parking-manager/backend
            dockerfile: Student/Resources/parking-manager/backend/lisbon-parking-api/Dockerfile
          - name: berlin-parking-api
            context: Student/Resources/parking-manager/backend
            dockerfile: Student/Resources/parking-manager/backend/berlin-parking-api/Dockerfile
          - name: berlin-mcp-server
            context: Student/Resources/parking-manager/backend/berlin-mcp-server
            dockerfile: Student/Resources/parking-manager/backend/berlin-mcp-server/Dockerfile
          - name: chaos-control
            context: Student/Resources/parking-manager/backend/chaos-control
            dockerfile: Student/Resources/parking-manager/backend/chaos-control/Dockerfile
          - name: vm-health-control
            context: Student/Resources/parking-manager/backend/vm-health-control
            dockerfile: Student/Resources/parking-manager/backend/vm-health-control/Dockerfile
          - name: parking-manager-frontend
            context: Student/Resources/parking-manager/frontend/parking-manager
            dockerfile: Student/Resources/parking-manager/frontend/parking-manager/Dockerfile
          - name: grubify-api
            context: Student/Resources/grubify/GrubifyApi
            dockerfile: Student/Resources/grubify/GrubifyApi/Dockerfile
          - name: grubify-frontend
            context: Student/Resources/grubify/grubify-frontend
            dockerfile: Student/Resources/grubify/grubify-frontend/Dockerfile
    steps:
      - name: Lower case REPO
        run: |
          echo "GITHUB_REPOSITORY_LOWER_CASE=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=${{ env.GITHUB_REPOSITORY_LOWER_CASE }}/${{ matrix.name }}" >> $GITHUB_ENV

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: extract_version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Generate summary
        run: |
          echo "## Docker Image Published: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY