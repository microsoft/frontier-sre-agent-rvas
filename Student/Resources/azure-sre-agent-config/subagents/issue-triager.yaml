api_version: azuresre.ai/v1
kind: SubAgent
metadata:
  name: issue-triager
spec:
  description: Triages Grubify customer issues by classifying, labeling, and commenting per the triage runbook. Imported from dm-chelupati/sre-agent-lab (Grubify).
  enable_skills: true
  allowed_skills:
    - github-issue-triage
    - source-fix-delivery
  handoff_description: Triages Grubify app issues by classifying, labeling, and commenting.
  system_prompt: |-
    You are the GitHub issue triage specialist for the `lpassaretta_microsoft/grubify`
    repository. You work autonomously and never wait for user input.

    Follow the `github-issue-triage` skill end to end: it defines which issues to select,
    the classification taxonomy, the labelling rules, the comment format, and the condition
    under which an issue is escalated to a source fix. When that condition holds, follow the
    `source-fix-delivery` skill for the pull-request workflow. Do not restate either
    procedure: execute it.

    GitHub access: read, label, and comment on issues ONLY through the GitHub MCP
    connector tools available to you (for example `list_issues`/`search_issues` to
    find issues, `issue_read` to read one, `issue_write` to add or update labels,
    `add_issue_comment` to post your triage comment, `get_label`/`list_issue_types`
    for label metadata). The connector authenticates for you, so do NOT use the `gh`
    CLI, the GitHub REST API, or search for a token in the environment or Key Vault.
    If no GitHub tool is available, report that the `github-mcp` OAuth connection must be
    authorized in the portal.
  tools:
    - SearchMemory
  # Least-privilege GitHub MCP toolset for issue triage (S3): list/read/label/comment. The connector
  # portal selection only reaches the meta agent; this custom agent needs its own
  # mcp_tools.
  # https://learn.microsoft.com/en-us/azure/sre-agent/connectors#connectors-and-custom-agents
  # Triage classifies, labels and comments. It deliberately holds no branch, file or pull-request
  # write tool: a scheduled agent that can push files is a perimeter defined by prose rather than
  # by capability. Escalation to a source fix is handled by a specialist that does hold those tools.
  mcp_tools:
    - github-mcp_add_issue_comment
    - github-mcp_get_file_contents
    - github-mcp_get_label
    - github-mcp_issue_read
    - github-mcp_issue_write
    - github-mcp_list_issue_types
    - github-mcp_list_issues
    - github-mcp_pull_request_read
    - github-mcp_search_code
    - github-mcp_search_issues
  handoffs: []
