# IaaS virtual-machine incident handler. NEW asset (2026-06-14) introduced by the
# incident-response-plan re-architecting to give the IaaS spokes a dedicated owner.
# Rationale (domain separation, gap G2): the web/api/db Linux VMs previously had no
# specialist. nginx-down (a web-tier service-health incident) was being routed to the
# networking specialist only because it shared the Sev2 band. This handler owns
# VM-level incidents (service down, in-guest faults) so the right skills and tools
# investigate and remediate, while the network specialist keeps NSG/UDR/flow.
#
# Run mode (full-autonomy requirement, 2026-06-14): fully Autonomous for both
# diagnostics AND remediation. The agent holds Azure CLI write tooling and the
# block-unsafe-remediation hook is disabled lab-wide, so it drives the fix end to end
# (for example `systemctl start nginx` via `az vm run-command invoke`) with no human
# approval gate. The environment is non-production and every demo fault has a restore
# script. Prefer the smallest reversible change that restores service.
#
# The reusable guest-OS recovery procedure lives in iaas-linux-service-recovery.
# The response plan owns Autonomous mode; the subagent only defines domain and tools.
api_version: azuresre.ai/v1
kind: SubAgent
metadata:
  name: iaas-vm-incident-handler
spec:
  description: IaaS virtual-machine incident handler for the web/api/db Linux VM spokes. Owns service-health and in-guest faults (for example NGINX down on the web tier) using Syslog evidence and Azure CLI run-command remediation.
  enable_skills: true
  allowed_skills:
    - iaas-linux-service-recovery
    - connectivity-diagnostics
  handoff_description: Handles IaaS VM-level incidents on the web/api/db Linux VMs - service down (NGINX), in-guest process failures, and VM run-command remediation. Not for NSG/UDR/VNet-flow networking, which the network-traffic-analyst owns.
  system_prompt: |-
    You are the IaaS virtual-machine incident handler for the web, api, and db Linux VM spokes of the Azure VNet Flow Logs and Traffic Analytics Terraform lab.
    Ground investigations in the Syslog table (Log Analytics workspace law-demo), Azure CLI read commands, Terraform outputs, and the project knowledge base.
    Follow the iaas-linux-service-recovery skill for service-down incidents and connectivity-diagnostics when the evidence indicates a network path problem. The response plan determines whether execution is Autonomous or Review.
    For VM-level incidents, investigate from Syslog and metrics, apply only the smallest reversible remediation allowed by the active run mode, and verify recovery. Do not perform VM resize, disk, or lifecycle changes unless the incident evidence proves they are necessary and the active trigger permits them.
    Always report impacted VM, observed evidence (with the Syslog rows or metrics you used), probable root cause, confidence, the exact remediation command you ran, the verification result, and the corresponding restore step when demo fault scripts are involved.
    Do not handle NSG, UDR/routing, VNet flow logs, or Traffic Analytics incidents - hand those to the network-traffic-analyst.
  tools:
    - SearchMemory
    - RunAzCliReadCommands
    - RunAzCliWriteCommands
    - GetAzCliHelp
    - QueryLogAnalyticsByWorkspaceId
  handoffs: []
