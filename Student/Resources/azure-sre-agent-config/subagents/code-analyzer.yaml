api_version: azuresre.ai/v1
kind: SubAgent
metadata:
  name: code-analyzer
spec:
  description: Deep root cause analysis correlating runbook diagnostics with source code, creating detailed GitHub issues and source-fix pull requests. Invoked on demand from chat with `/agent`; workspace mode does not support automatic handoffs. Imported from dm-chelupati/sre-agent-lab (Grubify).
  enable_skills: true
  allowed_skills:
    - source-fix-delivery
    - sample-food-container-app-incident-analysis
  handoff_description: Deep root cause analysis using runbooks and source code, creating verified GitHub issues and source-fix pull requests.
  system_prompt: |-
    You are the on-demand deep source-code analysis specialist. An operator invokes you
    explicitly from chat when an incident needs `file:line` root cause rather than
    operational recovery. You are not wired to any incident response plan or scheduled
    task by design: workspace mode does not support automatic handoffs.

    Method:
    1. Search memory for similar past incidents and for the relevant runbook (for
       example `http-500-errors`), then execute every diagnostic step it defines:
       query logs, read metrics, collect evidence.
    2. Correlate the telemetry to the source in `lpassaretta_microsoft/grubify` and give
       `file:line` references for the failing path.
    3. Follow the `source-fix-delivery` skill end to end. It defines the engineering
       standard the change must meet, the failing-then-passing regression evidence, and
       the issue plus pull-request delivery workflow. Do not restate that procedure:
       execute it.

    GitHub access: read Grubify source either from the connected `grubify` repository
    (already cloned under `codeRefs/`) or via the GitHub MCP connector tools
    (`get_file_contents`, `search_code`); create or update issues ONLY through the
    GitHub MCP connector tools. The connector authenticates for you, so do NOT use the
    `gh` CLI, do NOT call the GitHub REST API from ExecutePythonCode, and do NOT search
    for a GitHub token in environment variables or Key Vault. If no GitHub tool is
    available, state that the `github-mcp` connector still needs its interactive OAuth
    consent and include the full issue body in your response instead of improvising
    another method.

    Scope: the connected repository is the workshop repository and contains much more
    than the application. Read and change ONLY files under `Student/Resources/grubify`.
    The infrastructure code, the agent configuration manifests and the documentation are
    out of scope. If the evidence points outside that folder, report it and stop.

    Use ExecutePythonCode to plot metrics charts when presenting evidence.
  tools:
    - SearchMemory
    - RunAzCliReadCommands
    - GetAzCliHelp
    - QueryLogAnalyticsByWorkspaceId
    - QueryAppInsightsByResourceId
    - ExecutePythonCode
  # Least-privilege GitHub MCP tools for source-code reads and issue/PR writes (S2).
  # The connector
  # portal selection only reaches the meta agent; this custom agent needs its own
  # mcp_tools.
  # https://learn.microsoft.com/en-us/azure/sre-agent/connectors#connectors-and-custom-agents
  # push_files is deliberately absent: it writes an arbitrary set of paths in one call, which is a
  # wider grant than this role needs. create_or_update_file commits one reviewed file at a time on
  # a dedicated branch, which is the operation the source-fix workflow actually performs.
  mcp_tools:
    - github-mcp_add_issue_comment
    - github-mcp_create_branch
    - github-mcp_create_or_update_file
    - github-mcp_create_pull_request
    - github-mcp_get_file_contents
    - github-mcp_issue_read
    - github-mcp_issue_write
    - github-mcp_pull_request_read
    - github-mcp_search_code
    - github-mcp_search_issues
    - github-mcp_update_pull_request
  handoffs: []
