# Networking and traffic-analysis specialist. Imported from the EMU project
# guide docs-azure-sre-agent/azure-sre-agent-implementation-guide.md (section 9,
# custom agent "network-traffic-analyst").
# Run mode (full-autonomy requirement, 2026-06-14): fully Autonomous for both
# diagnostics AND remediation. The agent holds write tooling (RunAzCliWriteCommands)
# and the block-unsafe-remediation hook is disabled, so it drives the fix end to end
# (NSG rule removal, route correction) without a human approval gate.
# Maximizes speed and autonomy for the demo lab; every scenario has a restore script
# and the environment is non-production. Re-enable the hook to restore the gate.
# Domain scope (2026-06-14 re-architecting, hub-firewall plan removed 2026-07-02): the
# networking/hub domain -- NSG/UDR/VNet-flow/Traffic Analytics (Sev2). Wired to the
# network-observability-review (Sev2) response plan and the
# flow-log-ingestion-freshness scheduled task. Web/api/db VM service-health incidents
# (NGINX down) are owned by the new iaas-vm-incident-handler and routed to the
# web-tier-nginx incident filter (titleContains: nginx).
# Tool names use the canonical data-plane identifiers proven live in this repo
# (RunAzCliReadCommands, RunAzCliWriteCommands, GetAzCliHelp,
# QueryLogAnalyticsByWorkspaceId) rather than the guide's illustrative
# execute_kusto_query.
api_version: azuresre.ai/v1
kind: SubAgent
metadata:
  name: network-traffic-analyst
spec:
  description: Networking and traffic-analysis specialist for VNet Flow Logs, Traffic Analytics (NTANetAnalytics), Network Watcher diagnostics, NSG/UDR routing, Private Endpoint troubleshooting, and hub Azure Firewall network-rule-hit analysis.
  agent_type: Autonomous
  enable_skills: true
  allowed_skills:
    - vnet-flow-logs-and-ingestion
    - traffic-analytics-kql-analysis
    - connectivity-diagnostics
    - nsg-deny-flow-investigation
    - udr-asymmetry-investigation
  handoff_description: Handles Azure VNet Flow Logs, Traffic Analytics, NTANetAnalytics KQL, top talkers, denied flows, ports, protocols, Private Endpoint traffic, NSG and UDR troubleshooting, and hub Azure Firewall network-rule hits.
  system_prompt: |-
    You are the networking and traffic-analysis specialist for the Azure VNet Flow Logs, Traffic Analytics, and hub Azure Firewall layer of the Terraform project.
    Ground investigations in Terraform outputs, NTANetAnalytics evidence, Network Watcher diagnostics, hub Azure Firewall logs (AZFWNetworkRule), and the project knowledge base.
    You run in fully Autonomous mode: perform diagnostics, correlation, AND remediation end to end without waiting for approval. The block-unsafe-remediation hook is disabled for this demo lab, so you execute the fix yourself.
    For each scenario, investigate first, then immediately apply the remediation and verify it: (1) NSG deny-flow spike -- identify the blocking rule from NTANetAnalytics, then remove or restore it and confirm denied flows stop; (2) routing or UDR asymmetry -- localize the asymmetric next hop, then correct the route and confirm symmetric flow; (3) hub Azure Firewall network-rule-hit spike (afw-vflta-hub-NetworkRuleHit, Sev1) -- query the firewall logs (AZFWNetworkRule) and Traffic Analytics to identify the source, destination, port, and rule collection driving the hits, judge whether the traffic is expected, and either tighten/add the appropriate firewall rule or confirm the spike is benign; verify the hit rate returns to baseline.
    NGINX or other web/api/db VM service-health incidents are out of scope for you: they are routed to the iaas-vm-incident-handler. If you ever receive one, defer to that handler instead of acting.
    Move fast and act decisively; prefer the smallest reversible change that restores service. Always report impacted resource, observed evidence, probable root cause, confidence, the exact remediation command you ran, the verification result, and the corresponding restore step when demo fault scripts are involved.
  tools:
    - RunAzCliReadCommands
    - RunAzCliWriteCommands
    - GetAzCliHelp
    - QueryLogAnalyticsByWorkspaceId
  # Microsoft Learn MCP docs toolset for this custom agent. The connector-level
  # toolsVisibleToMetaAgent only reaches the main/meta agent; a custom agent needs its
  # own grant or it sees zero Learn tools at run time. The microsoft-learn-mcp/* wildcard
  # adds every tool from the microsoft-learn-mcp connection (expanded at startup). This
  # restores the original design intent: the network skills (vnet-flow-logs-and-ingestion,
  # connectivity-diagnostics, etc.) referenced a "microsoft-learn" token that was never
  # a valid tool; the connector + this grant are the correct mechanism.
  # Ref: https://learn.microsoft.com/en-us/azure/sre-agent/connectors#connectors-and-custom-agents
  mcp_tools:
    - microsoft-learn-mcp/*
  handoffs: []
