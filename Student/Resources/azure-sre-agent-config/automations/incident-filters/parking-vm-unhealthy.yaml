# Parking Manager synthetic VM-health incident filter for Challenge 10.
# This reporting workflow creates or updates a GitHub issue; it does not remediate the VM.
# Deployed via data-plane v2 /api/v2/extendedAgent/incidentFilters/{name}.
api_version: azuresre.ai/v1
kind: IncidentFilter
metadata:
  name: parking-vm-unhealthy
spec:
  incidentPlatform: AzMonitor
  isEnabled: true
  priorities:
    - Sev2
  titleContains: "Parking VM Unhealthy Alert"
  handlingAgent: parking-vm-incident-reporter
  agentMode: Autonomous
  maxAutomatedInvestigationAttempts: 2
