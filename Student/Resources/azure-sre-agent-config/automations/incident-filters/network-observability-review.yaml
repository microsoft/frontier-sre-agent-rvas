# Networking observability incident filter (severity band: Sev2, networking domain).
# Routes Azure Monitor Sev2 networking alerts to the network-traffic-analyst specialist.
# Deployed via data-plane v2 /api/v2/extendedAgent/incidentFilters/{name}.
api_version: azuresre.ai/v1
kind: IncidentFilter
metadata:
  name: network-observability-review
spec:
  incidentPlatform: AzMonitor
  isEnabled: true
  priorities:
    - Sev2
  # Positive domain routing: networking alerts carry the network- prefix in their display name,
  # which is what Azure Monitor uses as the incident title. Matching on it makes the routing
  # deterministic instead of inferring the domain from free-text keywords.
  # titleContains is a single string; only titleContainsAll, titleContainsAny and
  # titleNotContains take lists. Passing a list here is rejected with HTTP 400.
  titleContains: network-
  titleNotContains:
    - nginx
  handlingAgent: network-traffic-analyst
  agentMode: Autonomous
  maxAutomatedInvestigationAttempts: 2
