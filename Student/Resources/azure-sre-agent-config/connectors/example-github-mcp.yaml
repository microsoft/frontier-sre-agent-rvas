# GitHub remote MCP server connector (Option B: MCP + PAT, no interactive OAuth).
api_version: azuresre.ai/v1
kind: AgentConnector
metadata:
  name: github-mcp
spec:
  properties:
    dataConnectorType: Mcp
    dataSource: github-mcp
    extendedProperties:
      type: http
      endpoint: https://api.githubcopilot.com/mcp/
      authType: BearerToken
      bearerToken: ${GITHUB_PAT}
      toolsVisibleToMetaAgent:
        - github-mcp_add_comment_to_pending_review
        - github-mcp_add_issue_comment
        - github-mcp_add_reply_to_pull_request_comment
        - github-mcp_assign_copilot_to_issue
        - github-mcp_create_branch
        - github-mcp_create_or_update_file
        - github-mcp_create_pull_request
        - github-mcp_create_pull_request_with_copilot
        - github-mcp_create_repository
        - github-mcp_delete_file
        - github-mcp_fork_repository
        - github-mcp_get_commit
        - github-mcp_get_copilot_job_status
        - github-mcp_get_file_contents
        - github-mcp_get_label
        - github-mcp_get_latest_release
        - github-mcp_get_me
        - github-mcp_get_release_by_tag
        - github-mcp_get_tag
        - github-mcp_get_team_members
        - github-mcp_get_teams
        - github-mcp_issue_read
        - github-mcp_issue_write
        - github-mcp_list_branches
        - github-mcp_list_commits
        - github-mcp_list_issue_fields
        - github-mcp_list_issue_types
        - github-mcp_list_issues
        - github-mcp_list_pull_requests
        - github-mcp_list_releases
        - github-mcp_list_repository_collaborators
        - github-mcp_list_tags
        - github-mcp_merge_pull_request
        - github-mcp_pull_request_read
        - github-mcp_pull_request_review_write
        - github-mcp_push_files
        - github-mcp_request_copilot_review
        - github-mcp_run_secret_scanning
        - github-mcp_search_code
        - github-mcp_search_commits
        - github-mcp_search_issues
        - github-mcp_search_pull_requests
        - github-mcp_search_repositories
        - github-mcp_search_users
        - github-mcp_sub_issue_write
        - github-mcp_update_pull_request
        - github-mcp_update_pull_request_branch
    identity: system