# The workshop currently requires two GitHub connectors. The new GitHub OAuth connector is the
# primary connector for interactive agent chats, but its tools are not yet exposed to threads
# started by incident automations. Those threads therefore also need the legacy GitHub MCP
# connector to perform GitHub actions. For example, the incident automation in Challenge 10 uses
# the legacy connector to open a GitHub issue.
# This dual-connector setup is temporary. Once the GitHub OAuth connector exposes its tools to
# incident automation threads, the legacy GitHub MCP connector will no longer be required.
api_version: azuresre.ai/v1
kind: AgentConnector
metadata:
  name: github-mcp-v1
spec:
  properties:
    dataConnectorType: Mcp
    dataSource: github-mcp-v1
    endpoint: https://api.githubcopilot.com/mcp/
    extendedProperties:
      type: http
      endpoint: https://api.githubcopilot.com/mcp/
      authType: BearerToken
      bearerToken: ${GITHUB_PAT}
      toolsVisibleToMetaAgent:
        - github-mcp-v1_add_comment_to_pending_review
        - github-mcp-v1_add_issue_comment
        - github-mcp-v1_add_reply_to_pull_request_comment
        - github-mcp-v1_assign_copilot_to_issue
        - github-mcp-v1_create_branch
        - github-mcp-v1_create_or_update_file
        - github-mcp-v1_create_pull_request
        - github-mcp-v1_create_pull_request_with_copilot
        - github-mcp-v1_create_repository
        - github-mcp-v1_delete_file
        - github-mcp-v1_fork_repository
        - github-mcp-v1_get_commit
        - github-mcp-v1_get_copilot_job_status
        - github-mcp-v1_get_file_contents
        - github-mcp-v1_get_label
        - github-mcp-v1_get_latest_release
        - github-mcp-v1_get_me
        - github-mcp-v1_get_release_by_tag
        - github-mcp-v1_get_tag
        - github-mcp-v1_get_team_members
        - github-mcp-v1_get_teams
        - github-mcp-v1_issue_read
        - github-mcp-v1_issue_write
        - github-mcp-v1_list_branches
        - github-mcp-v1_list_commits
        - github-mcp-v1_list_issue_fields
        - github-mcp-v1_list_issue_types
        - github-mcp-v1_list_issues
        - github-mcp-v1_list_pull_requests
        - github-mcp-v1_list_releases
        - github-mcp-v1_list_repository_collaborators
        - github-mcp-v1_list_tags
        - github-mcp-v1_merge_pull_request
        - github-mcp-v1_pull_request_read
        - github-mcp-v1_pull_request_review_write
        - github-mcp-v1_push_files
        - github-mcp-v1_request_copilot_review
        - github-mcp-v1_run_secret_scanning
        - github-mcp-v1_search_code
        - github-mcp-v1_search_commits
        - github-mcp-v1_search_issues
        - github-mcp-v1_search_pull_requests
        - github-mcp-v1_search_repositories
        - github-mcp-v1_search_users
        - github-mcp-v1_sub_issue_write
        - github-mcp-v1_update_pull_request
        - github-mcp-v1_update_pull_request_branch
