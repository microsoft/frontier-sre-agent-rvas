# Microsoft Learn MCP connector.
api_version: azuresre.ai/v1
kind: AgentConnector
metadata:
  name: microsoft-learn-mcp
spec:
  properties:
    dataConnectorType: Mcp
    endpoint: https://learn.microsoft.com/api/mcp
    dataSource: https://learn.microsoft.com/api/mcp
    extendedProperties:
      type: http
      endpoint: https://learn.microsoft.com/api/mcp
      # Tools exposed to the MAIN/meta agent (portal chat). Without this field the
      # connector reaches Connected but the meta agent sees zero Learn tools, so a
      # docs query in chat fails with "tool not available" even though the server is
      # healthy. The portal "Edit connector > MCP Tools" selection is persisted here;
      # codifying it stops a connector re-apply (full PUT) from wiping the selection
      # (same pattern as github-mcp.yaml). Tool IDs are namespaced {connection-id}_{tool}
      # = microsoft-learn-mcp_<tool>; these are the official Learn MCP tools
      # (https://github.com/MicrosoftDocs/mcp). Custom agents need their OWN grant via
      # spec.mcp_tools (see subagents/*.yaml: microsoft-learn-mcp/*).
      toolsVisibleToMetaAgent:
        - microsoft-learn-mcp_microsoft_docs_search
        - microsoft-learn-mcp_microsoft_docs_fetch
        - microsoft-learn-mcp_microsoft_code_sample_search
      identity: ""
