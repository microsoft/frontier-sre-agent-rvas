api_version: azuresre.ai/v1
kind: Skill
metadata:
  name: nsg-deny-flow-investigation
spec:
  description: Investigate NSG-denied Traffic Analytics flows and correlate denied records with NSG rules, subnet associations, and demo fault injection.
  content_file: ./nsg-deny-flow-investigation.md
  tools:
    - RunAzCliReadCommands
    - QueryLogAnalyticsByWorkspaceId
    - GetAzCliHelp
  safety:
    default_mode: read_only
    requires_approval_for_actions: true