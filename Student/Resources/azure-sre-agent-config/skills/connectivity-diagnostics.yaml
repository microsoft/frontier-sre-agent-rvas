# Consolidated skill (2026-07-02): merges the former network-watcher-diagnostics and
# private-endpoint-traffic-analysis skills into one connectivity-diagnostics skill. Both drove
# point-in-time Network Watcher reasoning about whether a source can reach a destination; the
# Private Endpoint case is the same procedure with a DNS/source-side-capture special case, so
# they are unified to stay within the official five-active-skills cap and follow the "one
# focused, non-overlapping procedure per skill" best practice.
# Source: https://learn.microsoft.com/en-us/azure/sre-agent/skills (Limits and constraints).
api_version: azuresre.ai/v1
kind: Skill
metadata:
  name: connectivity-diagnostics
spec:
  description: Select and run the right read-only Network Watcher connectivity diagnostic (IP flow verify, next hop, effective NSG/routes, connection troubleshoot) for VM/VNet reachability, including the Private Endpoint source-side path and private DNS resolution.
  content_file: ./connectivity-diagnostics.md
  tools:
    - RunAzCliReadCommands
    - QueryLogAnalyticsByWorkspaceId
    - GetAzCliHelp
  safety:
    default_mode: read_only
    requires_approval_for_actions: true
