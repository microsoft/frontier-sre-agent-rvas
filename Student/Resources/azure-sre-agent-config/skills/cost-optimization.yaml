api_version: azuresre.ai/v1
kind: Skill
metadata:
  name: cost-optimization
spec:
  description: >-
    Analyze and optimize Azure cost across a scope using resource inventory and configuration,
    actual spend, utilization, and Azure Advisor, weighted by each workload's criticality, SLA,
    resiliency, performance, and budget. Recommendations only; never modifies resources.
  files:
    - ./cost-optimization.md
    - ./cost-optimization/references/cost-queries.md
  tools:
    - RunAzCliReadCommands
    - QueryLogAnalyticsByWorkspaceId
    - QueryAppInsightsByResourceId
    - ExecutePythonCode
    - GetAzCliHelp
