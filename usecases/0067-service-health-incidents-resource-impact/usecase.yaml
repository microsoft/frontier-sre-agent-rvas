id: 0067-service-health-incidents-resource-impact
status: idea
title: "Service Health incidents & resource impact"
summary: "Detects Azure platform incidents and maps them to specific customer resources to quantify blast radius during outages."
domain: management
trigger: [alert]
frequency: "On new incident"
timeSaved: High
topPick: true
samplePrompt: "Check Azure Service Health for any active incidents affecting resources in my subscriptions. Show incident title, affected services, impacted regions, status, and list my specific resources in those regions. For each impacted resource, show current health status and dependent workloads affected. Suggest mitigation actions if available."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
