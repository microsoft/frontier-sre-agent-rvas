id: high-privilege-operation-tracking
status: idea
title: "High-privilege operation tracking"
summary: "Monitors sensitive operations (role assignments, policy changes, key vault access) that could indicate security issues or excessive privilege use."
domain: identity-access
trigger: [schedule]
frequency: "Daily"
timeSaved: High
topPick: false
samplePrompt: "Query Activity Log for the last 24 hours. Filter for high-privilege operations: role assignment create/delete, policy assignment create/delete, key vault secret access, subscription-level deployments, management group changes. Show caller, operation, target, and timestamp."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
