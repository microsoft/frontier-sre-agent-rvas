id: certificate-renewal-automation
status: idea
title: "Certificate renewal automation"
summary: "Monitors certificate expiration in Key Vault and triggers renewal workflows before expiry causes outages."
domain: security
trigger: [schedule]
frequency: "Daily"
timeSaved: High
topPick: false
samplePrompt: "Check all certificates in Key Vault accounts across subscriptions. For each: show subject, issuer, expiration date, auto-renewal status, and days remaining. For certificates expiring in < 30 days without auto-renewal: trigger renewal workflow or alert the certificate owner. Show certificates that failed auto-renewal attempts."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
