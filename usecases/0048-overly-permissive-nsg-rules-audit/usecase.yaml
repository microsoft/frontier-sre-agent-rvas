id: 0048-overly-permissive-nsg-rules-audit
status: idea
title: "Overly permissive NSG rules audit"
summary: "Identifies network security rules that are too broad, exposing resources to unnecessary risk."
domain: network-topology
trigger: [schedule]
frequency: "Daily"
timeSaved: High
topPick: false
samplePrompt: "Scan all NSGs across subscriptions. Flag rules where: (1) source = 'Any' or '0.0.0.0/0' on non-load-balancer ports, (2) destination port = '*' (any), (3) priority allows wide port ranges (>100 ports). Show NSG name, rule name, direction, access, source, destination, and port range. Recommend tighter scoping."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
