id: resource-metrics-analysis
status: idea
title: "Resource metrics analysis"
summary: "Review a resource's performance metrics for troubleshooting or capacity planning."
domain: management
trigger: [chat]
frequency: "During incident"
timeSaved: Medium
topPick: false
samplePrompt: "Pull the key metrics for resource '{resource_id}' over the last 4 hours with 5-minute granularity. Include CPU, memory, disk IOPS, network in/out, and any resource-specific metrics. Highlight any values exceeding 80% of the resource limit."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
