id: alert-fatigue-analysis
status: idea
title: "Alert fatigue analysis"
summary: "Identifies noisy, low-value alerts that contribute to alert fatigue and reduce team responsiveness."
domain: management
trigger: [schedule]
frequency: "Weekly"
timeSaved: High
topPick: true
samplePrompt: "Analyze all alert rules that fired in the last 30 days. Identify: (1) alerts that fired > 50 times, (2) alerts that auto-resolved within 5 minutes > 80% of the time, (3) alerts where no action was taken (no comments, no state change). Recommend suppression, threshold adjustment, or consolidation."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
