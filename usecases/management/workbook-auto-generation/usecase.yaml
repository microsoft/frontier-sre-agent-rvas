id: workbook-auto-generation
status: idea
title: "Workbook auto-generation"
summary: "Draft an Azure Workbook with monitoring panels for the workload's resource types."
domain: management
trigger: [chat]
frequency: "On workload onboarding"
timeSaved: Medium
topPick: false
samplePrompt: "Generate an Azure Workbook for workload in resource group '{rg_name}'. Auto-detect resource types and include relevant panels: (1) resource health overview, (2) key performance metrics per resource type, (3) error/exception trends, (4) cost trend, (5) recent changes. Export as ARM template for deployment."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
