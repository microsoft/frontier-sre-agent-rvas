id: orphaned-resources-cost-impact-analysis
status: idea
title: "Orphaned resources & cost impact analysis"
summary: "Review unattached disks, public IPs and NICs, empty NSGs, idle load balancers, old snapshots, unused gateway backends, and empty App Service Plans. Estimate their costs."
domain: billing-entra-tenant
trigger: [schedule]
frequency: "Daily"
timeSaved: High
topPick: true
samplePrompt: "Query all subscriptions for orphaned resources: (1) managed disks not attached to any VM, (2) public IPs not associated with any resource, (3) NICs not attached to a VM, (4) NSGs not associated with any subnet or NIC, (5) Load Balancers with 0 healthy backend instances or 0 bytes processed in 7 days, (6) disk snapshots older than 90 days whose source disk no longer exists, (7) App Gateway/Front Door backend pools with 0 requests in 14 days, (8) App Service Plans hosting 0 apps or only stopped apps. For each, show resource name, type, RG, age, and monthly cost. Summarize total waste."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
