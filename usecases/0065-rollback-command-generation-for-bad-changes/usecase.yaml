id: 0065-rollback-command-generation-for-bad-changes
status: idea
title: "Rollback command generation for bad changes"
summary: "Draft commands to revert a problematic resource change, with a safety check where supported."
domain: management
trigger: [alert]
frequency: "On failed change"
timeSaved: High
topPick: false
samplePrompt: "A problematic change was detected on resource '{resource_id}' at {timestamp}. Based on Change Analysis, identify what was modified. Generate the az CLI or ARM API command to revert the change to its previous value. Include a safety check (--what-if where available)."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
