id: 0051-policy-compliance-state-monitoring
status: idea
title: "Policy compliance state monitoring"
summary: "Tracks compliance state trends and identifies resources falling out of compliance over time."
domain: governance
trigger: [schedule]
frequency: "Daily"
timeSaved: Medium
topPick: false
samplePrompt: "Show policy compliance summary for subscription '{subscription_name}'. Include: (1) total policies assigned, (2) compliant vs non-compliant resource count, (3) top 10 policies by non-compliance count, (4) resources that became non-compliant in the last 7 days. Show trend vs previous week."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
