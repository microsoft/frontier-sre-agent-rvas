id: 0021-databricks-dependency-configuration-review
status: validated
title: "Azure Databricks dependency and configuration review"
summary: "Read-only map of what an Azure Databricks workspace depends on, where its cost comes from, and 36 best-practice checks."
domain: platform-devops
trigger: [chat]
frequency: "On demand"
timeSaved: High
topPick: false
products: [azure-databricks, unity-catalog, azure-cost-management, azure-resource-manager, azure-sre-agent]
autonomy: read-only
samplePrompt: "Run the complete Azure Databricks dependency map and configuration review for <APPROVED_DATABRICKS_WORKSPACE_NAME> using operation=report and deliver all four files."
source: { type: community, url: "https://github.com/marioaguileraaa/sre-agent-use-cases/tree/main/08-databricks-dependency-configuration-review" }
package:
  version: 1.0.0
  apiVersion: azuresre.ai/v1
  requires:
    connectors: []
    roles:
      - "Reader on the Databricks resource group and its managed resource group (ARM)"
      - "Cost Management Reader on the subscription, for the cost section (optional)"
      - "CAN VIEW on in-scope jobs, pipelines, SQL warehouses and compute (Databricks workspace)"
      - "BROWSE, USE CATALOG and USE SCHEMA on in-scope Unity Catalog objects"
  parameters:
    SUBSCRIPTION_ID: "Subscription of the Databricks workspace"
    SRE_TENANT_ID: "Tenant of the SRE Agent"
    TARGET_TENANT_ID: "Tenant of the Databricks workspace (equal to SRE_TENANT_ID when it is the same tenant)"
    MANAGED_IDENTITY_CLIENT_ID: "Client ID of the agent user-assigned managed identity"
    FEDERATED_APP_CLIENT_ID: "Multi-tenant app registration used for cross-tenant access, if any"
    CROSS_TENANT_CERT_KEYVAULT_URL: "Key Vault that holds the cross-tenant app certificate (cross-tenant only)"
    CROSS_TENANT_CERT_NAME: "Name of that certificate in Key Vault (cross-tenant only)"
    APPROVED_WORKSPACES: "Allowlist of workspace names, resource groups and hosts"
    CLIENT_NAME: "Optional organization name on the report cover"
  contents:
    tools: [manifests/tools/databricks-dependency-report.yaml]
    skills: [manifests/skills/databricks-dependency-live/SKILL.md]
    subagents: [manifests/subagents/databricks-dependency-live.yaml]
    permissions: [permissions/grant-databricks-reader.ps1]
