id: 0068-sku-reliability-assessment
status: idea
title: "SKU reliability assessment"
summary: "Evaluates resource SKUs against availability requirements, identifying single points of failure or SLA gaps."
domain: management
trigger: [chat]
frequency: "Architecture review"
timeSaved: High
topPick: false
samplePrompt: "For resources in production tagged 'SLA=99.99%', check: (1) VM — is it using Availability Zones or VMSS? (2) SQL — is it Zone-redundant? (3) Storage — is it GRS/GZRS? (4) App Service — is it Premium or in ASE? Flag any resource where SKU SLA is below the stated target."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
