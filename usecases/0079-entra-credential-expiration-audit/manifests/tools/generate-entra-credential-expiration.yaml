api_version: azuresre.ai/v1
kind: Tool
metadata:
  name: generate-entra-credential-expiration
spec:
  type: PythonFunctionTool
  description: Use this tool to audit Microsoft Entra application and service principal credential expirations
    when you need to identify expiring secrets and certificates, exclude managed identity service principals,
    and generate a self-contained HTML report. Returns report path, scan coverage, and credential status
    counts.
  timeoutSeconds: 120
  code_file: ./generate-entra-credential-expiration.py
  parameters: []
