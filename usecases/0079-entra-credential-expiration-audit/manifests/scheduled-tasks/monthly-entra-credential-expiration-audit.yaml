api_version: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: monthly-entra-credential-expiration-audit
spec:
  description: Monthly Microsoft Entra credential expiration audit. Current credential snapshot on day
    1 of every month, read-only.
  schedule: "0 9 1 * *"
  time_zone: UTC
  enabled: false
  agent: credential-monitor-full
  mode: Autonomous
  prompt: Run the full Microsoft Entra credential expiration audit. Deliver the HTML report, coverage,
    risk counters and Action required when applicable.
