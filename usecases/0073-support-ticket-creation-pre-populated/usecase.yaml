samplePrompt: "Prepare a support ticket for resource '{resource_id}' issue: '{issue_description}'. Collect and include: (1) resource config and SKU, (2) relevant metrics last 4h, (3) related errors in logs, (4) recent changes from Activity Log, (5) Resource Health status. Format as a support request with severity, category, and collected evidence."
