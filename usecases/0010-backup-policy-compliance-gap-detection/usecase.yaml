id: 0010-backup-policy-compliance-gap-detection
status: idea
title: "Backup policy compliance & gap detection"
summary: "Verifies that all critical resources have backup configured and that backup jobs are completing successfully."
domain: management
trigger: [schedule]
frequency: "Daily"
timeSaved: High
topPick: false
samplePrompt: "Audit backup coverage: (1) VMs without Azure Backup enabled, (2) SQL databases without backup (PITR or long-term), (3) Cosmos DB accounts without continuous backup, (4) File shares without backup. Also check: failed backup jobs in last 7 days, backup items not backed up in > 24h. Show resource, backup status, last successful backup, and RPO gap."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
