id: vnet-peering-health-check
status: idea
title: "VNet peering health check"
summary: "Monitors VNet peering connections for status issues, disconnected peerings, or asymmetric configurations."
domain: network-topology
trigger: [schedule]
frequency: "Daily"
timeSaved: Medium
topPick: false
samplePrompt: "List all VNet peerings across subscriptions. Check: (1) peering status (Connected/Disconnected/Initiated), (2) both sides exist and are connected, (3) gateway transit settings are symmetric, (4) address space overlaps. Flag any peering not in 'Connected' state or with misconfigured transit."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
