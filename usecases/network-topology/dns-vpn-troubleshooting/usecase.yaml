topPick: false
samplePrompt: "Diagnose DNS and VPN issues: (1) check DNS resolution failures — which queries are returning NXDOMAIN or SERVFAIL, from which clients, for which domains, (2) check VPN tunnel status — which tunnels are down, disconnect reason, BGP peer state, and last successful connection time. Provide remediation steps."
