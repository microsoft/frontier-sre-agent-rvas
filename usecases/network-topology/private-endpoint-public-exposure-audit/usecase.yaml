id: private-endpoint-public-exposure-audit
status: idea
title: "Private endpoint & public exposure audit"
summary: "Inventory public PaaS endpoints and private endpoint coverage. Identify public access that needs review."
domain: network-topology
trigger: [schedule]
frequency: "Weekly"
timeSaved: High
topPick: false
samplePrompt: "List all Storage Accounts, SQL Servers, Key Vaults, Cosmos DB, App Services, and other PaaS resources across subscriptions. For each, check: (1) is public network access enabled? (2) are there private endpoints configured? (3) what is the public FQDN/IP? Flag resources with public access enabled but no private endpoint. Show resource, public endpoint, and recommendation."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
