id: naming-tagging-convention-compliance
status: idea
title: "Naming & tagging convention compliance"
summary: "Detects resources that violate organizational naming standards and required tag policies, impacting automation, cost allocation, and operational clarity."
domain: governance
trigger: [schedule]
frequency: "Weekly"
timeSaved: Medium
topPick: false
samplePrompt: "Check all resources against: (1) naming convention regex per resource type: VMs='{vm_pattern}', RGs='{rg_pattern}', Storage='{storage_pattern}'; (2) required tags: 'Environment', 'CostCenter', 'Owner', 'Application'. Show resources not matching patterns and those missing required tags. Prioritize production resources and sort by monthly cost."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
