id: azure-policy-assignment-assessment
status: idea
title: "Azure Policy assignment assessment"
summary: "Review policy assignments across management groups, subscriptions, and resource groups for duplicates, conflicting effects, exemptions, and ineffective parameters."
domain: governance
trigger: [schedule]
frequency: "Monthly"
timeSaved: High
topPick: true
samplePrompt: "List all Azure Policy assignments across the full management group hierarchy. Analyze for: (1) redundant assignments — same policy definition assigned at both a management group and a child subscription/RG, (2) conflicting assignments — policies with contradictory effects (e.g., one enforces 'deny' on a resource type while another applies 'deployIfNotExists' for the same), (3) orphaned assignments referencing deleted or deprecated policy definitions, (4) assignments with parameters that override or negate the intended effect. For each finding, show policy name, assignment scope, effect, and recommended action (remove, consolidate, or fix). Summarize total assignments, redundancies found, and conflicts detected."
source: { type: community, url: "https://github.com/alsanch/azure-sre-agent-scenarios" }
